spring:
  application:
    name: rental-saas

  datasource:
    url: jdbc:postgresql://localhost:5432/rentivo
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 4
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update # validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  lifecycle:
    timeout-per-shutdown-phase: 30s

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

server:
  port: 8080

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 86400000
    access-token-expiration: 900000       # 15 minutes
    refresh-token-expiration: 604800000   # 7 days
    otp-token-expiration: 300000   # 5 minutes
    password-reset-token-expiration: 300000   # 5 minutes

  cookie:
    secure: ${COOKIE_SECURE:true} # local dev set to false, in prod = true
    same-site: ${COOKIE_SAME_SITE:Lax} # if cross-site SameSite=None + appropriate CSRF protection

management:
  endpoints:
    web:
      exposure:
        include: mappings

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

rentivo:
  rabbitmq:
    exchange: rentivo.exchange
    queues:
      register-otp: register.otp.queue
      login-otp: login.otp.queue
      reset-password-otp: reset.password.otp.queue

  otp:
    expiry: 180000
    max-attempts: 5
    resend-cooldown: 60000
    max-resend-attempts: 3
    resend-window: 900000

  admin:
    first-name: ${ADMIN_FIRST_NAME:}
    last-name: ${ADMIN_LAST_NAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  cors:
    allowed-origins: http://localhost:3000

  seeder:
    enabled: false

app:
  file:
    upload:
      base-path: uploads

      # Agency documents
      agency-documents-path: ${app.file.upload.base-path}/agencies
      max-size: 5MB
      allowed-types:
        - application/pdf
        - image/jpeg
        - image/png

      # Property images
      property-images-path: ${app.file.upload.base-path}/properties
      max-image-size: 5MB
      max-images: 10
      allowed-image-types:
        - image/jpeg
        - image/png
        - image/webp

      # Cleanup
      cleanup-interval-ms: 3600000 # Every hour
      cleanup-after-hours: 24